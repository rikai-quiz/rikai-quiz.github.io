<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>りかいクイズ</title>
<style>
  :root {
    --bg: #fff8f3;
    --card: #ffffff;
    --text: #2b2b2b;
    --sub: #777;
    --accent: #ff7a59;
    --accent-weak: #ffe3d9;
    --ok: #2e9e6a;
    --ng: #d9534f;
    --border: #eee2da;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    background: var(--bg);
    color: var(--text);
    font-family: "Hiragino Sans", "Noto Sans JP", "Yu Gothic UI", sans-serif;
    line-height: 1.6;
  }
  main { max-width: 480px; margin: 0 auto; padding: 24px 16px 48px; }
  h1 { font-size: 1.4rem; margin: 8px 0 4px; }
  a { color: var(--accent); }
  .logo { color: var(--accent); font-weight: 700; font-size: .9rem; text-decoration: none; }
  .sub { color: var(--sub); font-size: .9rem; }
  .card {
    background: var(--card);
    border: 1px solid var(--border);
    border-radius: 16px;
    padding: 20px;
    margin-top: 16px;
  }
  label { font-size: .9rem; }
  input[type=text] {
    width: 100%;
    font-size: 1rem;
    padding: 12px;
    border: 1px solid var(--border);
    border-radius: 10px;
    margin: 6px 0 14px;
  }
  button {
    font: inherit;
    cursor: pointer;
    border: none;
    border-radius: 12px;
    padding: 14px 16px;
    width: 100%;
  }
  .primary { background: var(--accent); color: #fff; font-weight: 700; }
  .primary:disabled { opacity: .4; cursor: default; }
  .secondary { background: var(--accent-weak); color: var(--text); font-weight: 700; }
  .ghost { background: transparent; color: var(--sub); padding: 8px; width: auto; }
  .choice {
    display: block;
    background: var(--accent-weak);
    color: var(--text);
    text-align: left;
    margin-top: 10px;
  }
  .choice:hover { outline: 2px solid var(--accent); }
  .choice b { color: var(--accent); margin-right: 8px; }
  .choice.on, .choice.on b { background: var(--accent); color: #fff; }
  .progress { height: 6px; background: var(--border); border-radius: 3px; overflow: hidden; margin-top: 8px; }
  .progress > div { height: 100%; background: var(--accent); transition: width .2s; }
  .qnum { color: var(--sub); font-size: .85rem; margin-top: 12px; }
  .qtext { font-size: 1.15rem; font-weight: 700; margin: 4px 0 8px; }
  .score { font-size: 2.6rem; font-weight: 800; color: var(--accent); text-align: center; }
  .comment { text-align: center; font-weight: 700; }
  .share { word-break: break-all; font-size: .95rem; background: var(--bg); padding: 10px; border-radius: 8px; }
  .review { list-style: none; padding: 0; margin: 0; }
  .review li { border-top: 1px solid var(--border); padding: 10px 0; font-size: .9rem; }
  .review .mark { font-weight: 700; margin-right: 6px; }
  .review .ok { color: var(--ok); }
  .review .ng { color: var(--ng); }
  .rank { width: 100%; border-collapse: collapse; font-size: .95rem; }
  .rank td { padding: 8px 4px; border-top: 1px solid var(--border); }
  .rank td:last-child { text-align: right; font-weight: 700; }
  .rank tr.me td { color: var(--accent); }
  .bq { border-top: 1px solid var(--border); padding: 12px 0; font-size: .9rem; }
  .bq .qt { font-weight: 700; }
  .opt { margin-top: 6px; }
  .opt .line { display: flex; justify-content: space-between; gap: 8px; }
  .opt.correct .line { color: var(--accent); font-weight: 700; }
  .bar { height: 8px; background: var(--border); border-radius: 4px; overflow: hidden; margin: 3px 0; }
  .bar > div { height: 100%; background: #c9c0ba; }
  .opt.correct .bar > div { background: var(--accent); }
  .who { color: var(--sub); font-size: .8rem; }
  .row { display: flex; gap: 8px; margin-top: 12px; }
  .row button { flex: 1; }
  .stack > * + * { margin-top: 10px; }
  .error { color: var(--ng); font-size: .9rem; }
  .center { text-align: center; padding: 40px 0; color: var(--sub); }
</style>
</head>
<body>
<main id="app"></main>

<script>
// Google Apps Script を「ウェブアプリ」として公開したURL(…/exec)をここに貼る
const API_URL = "https://script.google.com/macros/s/AKfycbzmRVtg3boT8p98jKfz8l7VpCBS1gs9Uml7SOOCitCgW-TQ7n6v-DBi015lpwBPi3fR/exec";

const LABELS = ["A", "B", "C"];
const app = document.getElementById("app");
const esc = s => String(s).replace(/[&<>"']/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
const header = `<a class="logo" href="./">りかいクイズ</a>`;
const BASE = location.origin + location.pathname;

// ---- サーバーとの通信 ----
// POSTは text/plain で送る(Apps Scriptはプリフライトに応答できないため)
async function api(action, data, params = {}) {
  if (!API_URL) throw new Error("API_URL が設定されていません");
  const res = data
    ? await fetch(API_URL, { method: "POST", body: JSON.stringify({ action, ...data }) })
    : await fetch(API_URL + "?" + new URLSearchParams({ action, ...params }));
  const json = await res.json();
  if (json.error) throw new Error(json.error);
  return json;
}
const get = (action, params) => api(action, null, params);
const post = (action, data) => api(action, data);

function loading(msg = "読み込み中…") { app.innerHTML = `${header}<div class="center">${esc(msg)}</div>`; }
function fail(err) {
  app.innerHTML = `${header}<div class="card"><div class="error">${esc(err.message || err)}</div>
    <div class="row"><button class="secondary" onclick="location.href='./'">トップに戻る</button></div></div>`;
}

// 自分が作ったクイズは、このブラウザに覚えておく(トップから順位を見に行けるように)
function myQuizzes() { try { return JSON.parse(localStorage.getItem("rikai-mine")) || []; } catch { return []; } }
function rememberQuiz(q) { try { localStorage.setItem("rikai-mine", JSON.stringify([q, ...myQuizzes()].slice(0, 10))); } catch {} }

function commentFor(score, total) {
  const r = score / total;
  if (r === 1) return "全問正解。もはや本人より詳しいかも";
  if (r >= 0.75) return "かなり理解してる。いい関係です";
  if (r >= 0.5) return "半分はわかってる。もっと話すと見えてきそう";
  return "まだ知らない一面がたくさんありそう";
}

function rankTable(list, me) {
  if (!list.length) return `<div class="sub">まだ挑戦者はいません</div>`;
  return `<table class="rank">${list.map((r, i) =>
    `<tr class="${r.name === me ? "me" : ""}"><td>${i + 1}位</td><td>${esc(r.name)}</td><td>${r.score}/${r.total}</td></tr>`).join("")}</table>`;
}

// みんなの回答:問題ごとに、各選択肢の割合と選んだ人の名前を出す
function breakdown(quizName, questions, answers, people) {
  if (!people.length) return "";
  return `<div class="card"><b>みんなの回答</b>
    <div class="sub">${people.length}人が挑戦。オレンジが${esc(quizName)}の答えです。</div>
    ${questions.map((item, i) => `<div class="bq">
      <div class="qt">Q${i + 1}. ${esc(item.q)}</div>
      ${item.a.map((t, k) => {
        const names = people.filter(p => p.picks[i] === k).map(p => p.name);
        const pct = Math.round((names.length / people.length) * 100);
        return `<div class="opt ${answers[i] === k ? "correct" : ""}">
          <div class="line"><span>${LABELS[k]}. ${esc(t)}${answers[i] === k ? " ✓" : ""}</span><span>${pct}%</span></div>
          <div class="bar"><div style="width:${pct}%"></div></div>
          ${names.length ? `<div class="who">${names.map(esc).join("、")}</div>` : ""}
        </div>`;
      }).join("")}
    </div>`).join("")}
  </div>`;
}

// ---- 共通部品 ----

function runQuiz(questions, heading, onDone) {
  const picks = [];
  const render = () => {
    const i = picks.length;
    if (i === questions.length) return onDone(picks);
    const item = questions[i];
    app.innerHTML = `${header}
      <div class="sub">${esc(heading)}</div>
      <div class="progress"><div style="width:${(i / questions.length) * 100}%"></div></div>
      <div class="card">
        <div class="qnum">Q${i + 1} / ${questions.length}</div>
        <div class="qtext">${esc(item.q)}</div>
        ${item.a.map((t, k) => `<button class="choice" data-k="${k}"><b>${LABELS[k]}</b>${esc(t)}</button>`).join("")}
      </div>
      ${i > 0 ? `<button class="ghost" id="back">← ひとつ戻る</button>` : ""}`;
    app.querySelectorAll(".choice").forEach(b => b.onclick = () => { picks.push(Number(b.dataset.k)); render(); });
    const back = document.getElementById("back");
    if (back) back.onclick = () => { picks.pop(); render(); };
    window.scrollTo(0, 0);
  };
  render();
}

function nameForm({ title, lead, button, extra = "", onSubmit }) {
  app.innerHTML = `${header}
    <h1>${esc(title)}</h1>
    <div class="sub">${esc(lead)}</div>
    <div class="card">
      <label for="name">あなたの名前</label>
      <input type="text" id="name" maxlength="20" placeholder="例:たろう">
      <button class="primary" id="go" disabled>${esc(button)}</button>
      <div class="error" id="err"></div>
    </div>
    ${extra}`;
  const input = document.getElementById("name"), go = document.getElementById("go");
  input.oninput = () => go.disabled = !input.value.trim();
  go.onclick = async () => {
    go.disabled = true;
    try { await onSubmit(input.value.trim()); }
    catch (e) { document.getElementById("err").textContent = e.message; go.disabled = false; }
  };
}

// ---- トップ(作成者) ----

function home() {
  const mine = myQuizzes();
  nameForm({
    title: "あなたのこと、どれくらい理解されてる？",
    lead: "3択の質問に自分の答えを選んで、友だちに当ててもらおう。",
    button: "自分の答えを選ぶ",
    extra: `
      ${mine.length ? `<div class="card"><b>あなたが作ったクイズ</b><div class="stack" style="margin-top:8px">
        ${mine.map(q => `<div><a href="?q=${encodeURIComponent(q.id)}&rank=1">${esc(q.name)} のランキングを見る</a></div>`).join("")}
      </div></div>` : ""}
      <div class="row"><button class="ghost" onclick="location.href='?suggest=1'">質問のアイデアを送る</button></div>`,
    onSubmit: async name => {
      const { questions } = await get("questions");
      runQuiz(questions, `${name}さんの答えを選んでください`, answers => createQuiz(name, questions, answers));
    },
  });
}

async function createQuiz(name, questions, answers) {
  loading("クイズを作成中…");
  try {
    const { id, key } = await post("create", { name, qids: questions.map(q => q.id), answers });
    rememberQuiz({ id, name, key });
    history.replaceState(null, "", "?created=" + encodeURIComponent(id));
    created(id, name);
  } catch (e) { fail(e); }
}

function created(id, name) {
  const url = `${BASE}?q=${id}`;
  app.innerHTML = `${header}
    <h1>準備できました</h1>
    <div class="sub">このURLを友だちに送ると、「${esc(name)}の答え、いくつ当てられる？」に挑戦できます。</div>
    <div class="card">
      <div class="share">${esc(url)}</div>
      <div class="row">
        <button class="primary" id="copy">URLをコピー</button>
        ${navigator.share ? `<button class="primary" id="send">送る</button>` : ""}
      </div>
      <div class="sub" id="copied"></div>
    </div>
    <div class="row"><button class="secondary" onclick="location.href='?q=${id}&rank=1'">ランキングを見る</button></div>`;
  document.getElementById("copy").onclick = async () => {
    const msg = document.getElementById("copied");
    try { await navigator.clipboard.writeText(url); msg.textContent = "コピーしました"; }
    catch { msg.textContent = "コピーできませんでした。上のURLを長押しして選択してください"; }
  };
  const send = document.getElementById("send");
  if (send) send.onclick = () => navigator.share({ title: "りかいクイズ", text: `「${name}」の答え、いくつ当てられる？`, url }).catch(() => {});
}

// ---- 挑戦者 ----

async function challenge(id) {
  loading();
  let quiz;
  try { quiz = await get("quiz", { id }); } catch (e) { return fail(e); }
  nameForm({
    title: `「${quiz.name}」の答え、いくつ当てられる？`,
    lead: `全${quiz.questions.length}問・3択。${quiz.name}ならどれを選ぶか、当ててください。`,
    button: "挑戦する",
    extra: `<div class="row"><button class="ghost" onclick="location.href='?q=${encodeURIComponent(id)}&rank=1'">ランキングを見る</button></div>`,
    onSubmit: async name => runQuiz(quiz.questions, `${quiz.name}ならどれを選ぶ？`, picks => result(quiz, name, picks)),
  });
}

async function result(quiz, name, picks) {
  loading("採点中…");
  let r;
  try { r = await post("submit", { id: quiz.id, name, picks }); } catch (e) { return fail(e); }
  app.innerHTML = `${header}
    <h1>${esc(name)}さんの結果</h1>
    <div class="card">
      <div class="score">${r.score} / ${r.total}</div>
      <div class="comment">${esc(commentFor(r.score, r.total))}</div>
    </div>
    <div class="card"><b>ランキング</b>${rankTable(r.ranking, name)}</div>
    <div class="card">
      <b>答え合わせ</b>
      <ul class="review">
        ${quiz.questions.map((item, i) => {
          const hit = picks[i] === r.answers[i];
          return `<li><span class="mark ${hit ? "ok" : "ng"}">${hit ? "○" : "×"}</span>Q${i + 1}. ${esc(item.q)}<br>
            <span class="sub">${esc(quiz.name)}:${esc(item.a[r.answers[i]])}${hit ? "" : ` / あなた:${esc(item.a[picks[i]])}`}</span></li>`;
        }).join("")}
      </ul>
    </div>
    ${breakdown(quiz.name, quiz.questions, r.answers, r.people)}
    <div class="row">
      <button class="primary" onclick="location.href='./'">自分のクイズを作る</button>
    </div>
    <div class="row"><button class="ghost" onclick="location.href='?suggest=1'">質問のアイデアを送る</button></div>`;
  window.scrollTo(0, 0);
}

async function rankingView(id) {
  loading();
  try {
    const mine = myQuizzes().find(q => q.id === id);
    const r = await get("ranking", mine && mine.key ? { id, key: mine.key } : { id });
    app.innerHTML = `${header}
      <h1>「${esc(r.name)}」のランキング</h1>
      <div class="card">${rankTable(r.ranking)}</div>
      ${r.owner ? breakdown(r.name, r.questions, r.answers, r.people)
        : `<div class="sub" style="margin-top:12px">挑戦すると、みんながどれを選んだかも見られます。</div>`}
      ${r.owner ? `<div class="row"><button class="secondary" id="copy">挑戦用URLをコピー</button>
          <button class="secondary" id="edit">自分の答えを直す</button></div><div class="sub" id="copied"></div>`
        : `<div class="row"><button class="secondary" onclick="location.href='?q=${encodeURIComponent(id)}'">このクイズに挑戦する</button></div>`}`;
    const copy = document.getElementById("copy");
    if (copy) copy.onclick = async () => {
      try { await navigator.clipboard.writeText(`${BASE}?q=${id}`); document.getElementById("copied").textContent = "コピーしました"; }
      catch { document.getElementById("copied").textContent = `${BASE}?q=${id}`; }
    };
    const edit = document.getElementById("edit");
    if (edit) edit.onclick = () => editAnswers(id, mine.key, r);
  } catch (e) { fail(e); }
}

// 作成者が自分の答えを直す画面。保存すると全員のスコアが計算し直される
function editAnswers(id, key, r) {
  const answers = r.answers.slice();
  app.innerHTML = `${header}
    <h1>自分の答えを直す</h1>
    <div class="sub">変えたい問題の選択肢を押して、最後に保存してください。挑戦済みの人のスコアも新しい答えで計算し直されます。</div>
    ${r.questions.map((item, i) => `<div class="card">
      <div class="qnum">Q${i + 1}</div>
      <div class="qtext">${esc(item.q)}</div>
      ${item.a.map((t, k) => `<button class="choice" data-i="${i}" data-k="${k}"><b>${LABELS[k]}</b>${esc(t)}</button>`).join("")}
    </div>`).join("")}
    <div class="row"><button class="ghost" id="cancel">やめる</button><button class="primary" id="save">保存する</button></div>
    <div class="error" id="err"></div>`;
  const paint = () => app.querySelectorAll(".choice").forEach(b =>
    b.classList.toggle("on", answers[b.dataset.i] === Number(b.dataset.k)));
  app.querySelectorAll(".choice").forEach(b => b.onclick = () => { answers[b.dataset.i] = Number(b.dataset.k); paint(); });
  paint();
  document.getElementById("cancel").onclick = () => rankingView(id);
  const save = document.getElementById("save");
  save.onclick = async () => {
    save.disabled = true;
    try { await post("updateAnswers", { id, key, answers }); rankingView(id); }
    catch (e) { document.getElementById("err").textContent = e.message; save.disabled = false; }
  };
}

// ---- 質問の募集 ----

function suggestView() {
  app.innerHTML = `${header}
    <h1>質問のアイデアを送る</h1>
    <div class="sub">「これを聞けばその人らしさがわかる」という3択の質問を募集しています。採用されたら、次からクイズに出てきます。</div>
    <div class="card">
      <label for="sq">質問</label>
      <input type="text" id="sq" maxlength="60" placeholder="例:大事な決断で迷ったとき、最後に頼るのは？">
      ${LABELS.map((l, i) => `<label for="s${i}">選択肢 ${l}</label>
        <input type="text" id="s${i}" maxlength="30" placeholder="${["データや理屈", "直感", "信頼できる人の意見"][i]}">`).join("")}
      <label for="sby">あなたの名前(任意)</label>
      <input type="text" id="sby" maxlength="20">
      <button class="primary" id="send" disabled>送る</button>
      <div class="error" id="err"></div>
    </div>`;
  const ids = ["sq", "s0", "s1", "s2"];
  const val = id => document.getElementById(id).value.trim();
  const send = document.getElementById("send");
  ids.forEach(id => document.getElementById(id).oninput = () => send.disabled = ids.some(i => !val(i)));
  send.onclick = async () => {
    send.disabled = true;
    try {
      await post("suggest", { question: val("sq"), choices: [val("s0"), val("s1"), val("s2")], by: val("sby") });
      app.innerHTML = `${header}<div class="card"><h1>ありがとう！</h1><div class="sub">アイデアを受け取りました。</div>
        <div class="row"><button class="secondary" onclick="location.href='?suggest=1'">もう1つ送る</button>
        <button class="primary" onclick="location.href='./'">トップへ</button></div></div>`;
    } catch (e) { document.getElementById("err").textContent = e.message; send.disabled = false; }
  };
}

// ---- 画面の振り分け ----

const p = new URLSearchParams(location.search);
if (!API_URL) fail(new Error("準備中です(API_URL が未設定)"));
else if (p.get("suggest")) suggestView();
else if (p.get("q") && p.get("rank")) rankingView(p.get("q"));
else if (p.get("q")) challenge(p.get("q"));
else if (p.get("created")) {
  const q = myQuizzes().find(x => x.id === p.get("created"));
  q ? created(q.id, q.name) : home();
}
else home();
</script>
</body>
</html>
